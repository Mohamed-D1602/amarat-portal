<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | بوابة حي العمارات</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--petrol:#0F3D3E;--petrol-deep:#0A2C2D;--sand:#F4EEE3;--paper:#FDFBF5;--brick:#A94A32;--gold:#C9A227;--ink:#26221C;--muted:#6E675C;--line:#E2D9C8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Almarai',sans-serif;background:var(--sand);color:var(--ink);line-height:1.8;min-height:100vh}
h1,h2,h3{font-family:'Cairo',sans-serif}
/* top bar */
.bar{background:var(--petrol);color:#fff;padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.bar .b-title{display:flex;align-items:center;gap:.6rem}
.bar .mark{width:36px;height:36px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:var(--petrol-deep);font-family:'Cairo';font-weight:900}
.bar strong{font-family:'Cairo';font-size:.95rem}
.bar button{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:.35rem 1rem;font-family:'Cairo';font-weight:700;font-size:.8rem;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.12)}
main{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
/* login */
.login-card{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:16px;max-width:420px;margin:8vh auto;padding:2.2rem;box-shadow:0 10px 30px rgba(38,34,28,.12)}
.login-card h2{color:var(--petrol);text-align:center;margin-bottom:1.2rem}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:700;font-size:.85rem;color:var(--petrol);margin-bottom:.3rem}
.field input,select{width:100%;padding:.65rem .9rem;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-family:'Almarai';font-size:.92rem}
.field input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.btn{width:100%;background:var(--petrol);color:#fff;border:none;padding:.8rem;border-radius:10px;font-family:'Cairo';font-weight:800;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--petrol-deep)}
.btn:disabled{opacity:.6}
.msg{display:none;text-align:center;border-radius:10px;padding:.8rem;font-weight:700;margin-top:.9rem;font-size:.88rem}
.msg.err{background:#FBEAE4;color:var(--brick)}
.msg.ok{background:#E4F1E7;color:#256C3A}
/* tabs */
.tabs{display:flex;gap:.5rem;margin:1.2rem 0;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:.45rem 1.3rem;font-family:'Cairo';font-weight:800;font-size:.88rem;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.tab .cnt{background:var(--brick);color:#fff;border-radius:99px;font-size:.72rem;padding:0 .5rem;margin-inline-start:.3rem}
/* request cards */
.req{background:var(--paper);border:1px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:12px;padding:1.1rem 1.3rem;margin-bottom:.9rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.req .info strong{color:var(--petrol);font-family:'Cairo'}
.req .info div{font-size:.85rem;color:var(--muted)}
.req .acts{display:flex;gap:.5rem}
.req .acts button{border:none;border-radius:9px;padding:.5rem 1.1rem;font-family:'Cairo';font-weight:800;font-size:.85rem;cursor:pointer}
.ok-btn{background:#2E9E5B;color:#fff}
.no-btn{background:var(--brick);color:#fff}
.undo-btn{background:#E7E0D2;color:var(--muted)}
.wa-note{background:#25D366;color:#06301C;border:none;border-radius:9px;padding:.5rem 1rem;font-family:'Cairo';font-weight:800;font-size:.82rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.empty{text-align:center;color:var(--muted);padding:2.5rem;background:var(--paper);border:1px dashed var(--line);border-radius:12px}
/* street editor */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem}
.st-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1rem}
.st-card h3{color:var(--petrol);font-size:1rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.st-card .saved{font-size:.7rem;color:#2E9E5B;opacity:0;transition:opacity .3s}
.st-card .saved.show{opacity:1}
.st-row{display:grid;grid-template-columns:26px 1fr;gap:.4rem;align-items:center;margin-bottom:.4rem;font-size:.85rem}
.st-row select{padding:.35rem .5rem;font-size:.82rem}
.s0{background:#EFE8D8}.s1{background:#FAEEC9}.s2{background:#DCF2E4}
#panel{display:none}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:.6rem}
.cfg-warn{background:#FBEAE4;color:var(--brick);border-radius:12px;padding:1rem 1.3rem;font-weight:700;margin:1rem 0;display:none}
</style>
</head>
<body>
<div class="bar">
  <div class="b-title"><span class="mark">ع</span><strong>لوحة إدارة بوابة حي العمارات</strong></div>
  <button id="logoutBtn" style="display:none" onclick="doLogout()">تسجيل الخروج</button>
</div>
<main>
  <div class="cfg-warn" id="cfgWarn">⚠️ لم يتم ضبط إعدادات Supabase بعد — افتح هذا الملف وضع SUPABASE_URL و SUPABASE_ANON_KEY في أعلى الكود</div>

  <div class="login-card" id="loginCard">
    <h2>🔐 دخول الإدارة</h2>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="pass" type="password" dir="ltr" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="msg err" id="loginErr">بيانات الدخول غير صحيحة</div>
  </div>

  <div id="panel">
    <div class="tabs">
      <button class="tab on" data-tab="pending">طلبات قيد المراجعة <span class="cnt" id="cntPending">0</span></button>
      <button class="tab" data-tab="approved">المقبولون</button>
      <button class="tab" data-tab="rejected">المرفوضون</button>
      <button class="tab" data-tab="streets">⚡ حالة الشوارع</button>
      <button class="tab" data-tab="reps">👤 ممثلو الشوارع</button>
    </div>
    <div id="reqList"></div>
    <div id="stEditor" style="display:none">
      <div class="st-grid" id="stGrid"></div>
      <p class="hint">التغيير يُحفظ فوراً ويظهر لكل زوار الموقع خلال ثوانٍ</p>
    </div>
    <div id="repEditor" style="display:none">
      <div class="st-grid" id="repGrid"></div>
      <p class="hint">اكتب اسم الممثل ورقم هاتفه (بصيغة دولية مثل 447958289559) ثم اضغط حفظ</p>
    </div>
  </div>
</main>
<script>
// ================== CONFIG — paste your Supabase values here ==================
const SUPABASE_URL = "https://ilzhdixqjlkgdqdhslpv.supabase.co/rest/v1/"; // مثال: https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_cY5ymwG1u7y5hnFMKpNFug_Us4Gjm4D";   // من Settings → API → anon public
// =============================================================================

const configured = !SUPABASE_URL.includes("PASTE") && !SUPABASE_ANON_KEY.includes("PASTE");
let sb = null;
if (configured) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
else document.getElementById('cfgWarn').style.display = 'block';

const arabicNum = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const stName = n => 'شارع ' + arabicNum(n);
const UTIL = [['p','⚡'],['w','💧'],['c','🧹']];
const STATES = ['قيد الانتظار','جارٍ العمل','تم ✓'];

// ---------------- Auth ----------------
async function doLogin(){
  if(!sb) return;
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  err.style.display='none'; btn.disabled=true; btn.textContent='جاري الدخول...';
  const {error} = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pass').value
  });
  btn.disabled=false; btn.textContent='دخول';
  if(error){ err.style.display='block'; return; }
  enterPanel();
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function checkSession(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  if(session) enterPanel();
}
function enterPanel(){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('logoutBtn').style.display='inline-block';
  loadRequests('pending'); loadStreets();
}

// ---------------- Tabs ----------------
let curTab='pending';
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  curTab=t.getAttribute('data-tab');
  const streets = curTab==='streets', reps = curTab==='reps';
  document.getElementById('stEditor').style.display = streets?'block':'none';
  document.getElementById('repEditor').style.display = reps?'block':'none';
  document.getElementById('reqList').style.display = (streets||reps)?'none':'block';
  if(streets) loadStreets();
  else if(reps) loadReps();
  else loadRequests(curTab);
}));

// ---------------- Requests ----------------
async function loadRequests(status){
  const list=document.getElementById('reqList');
  list.innerHTML='<div class="empty">جاري التحميل...</div>';
  const {data,error} = await sb.from('join_requests').select('*').eq('status',status).order('created_at',{ascending:false});
  if(error){ list.innerHTML='<div class="empty">خطأ في التحميل: '+error.message+'</div>'; return; }
  // pending badge count (always refresh)
  const {count} = await sb.from('join_requests').select('*',{count:'exact',head:true}).eq('status','pending');
  document.getElementById('cntPending').textContent = arabicNum(count||0);
  if(!data.length){ list.innerHTML='<div class="empty">لا توجد طلبات هنا 🎉</div>'; return; }
  list.innerHTML='';
  data.forEach(r=>{
    const d=new Date(r.created_at);
    const el=document.createElement('div');
    el.className='req';
    el.innerHTML='<div class="info"><strong>'+r.name+'</strong>'+
      '<div>'+stName(r.street)+' · '+(r.type||'—')+(r.household_size?' · 👥 '+arabicNum(r.household_size):'')+'</div>'+
      '<div dir="ltr" style="text-align:right">'+r.phone+' · '+d.toLocaleDateString('ar-EG')+'</div></div>'+
      '<div class="acts" id="acts'+r.id+'"></div>';
    const acts=el.querySelector('.acts');
    const wphone=(r.phone||'').replace(/[^\d]/g,'');
    if(status==='pending'){
      acts.innerHTML='<button class="ok-btn" onclick="approveAndNotify('+r.id+',\''+wphone+'\','+r.street+')">✓ قبول</button>'+
                     '<button class="no-btn" onclick="setStatus('+r.id+',\'rejected\')">✕ رفض</button>';
    }else if(status==='approved'){
      acts.innerHTML='<a class="wa-note" href="https://wa.me/'+wphone+'?text='+encodeURIComponent('✅ أهلاً بك في حي العمارات! تمت الموافقة على طلبك وأنت الآن ضمن سكان '+stName(r.street)+' في البوابة الرسمية.')+'" target="_blank">💬 إشعار القبول</a>'+
                     '<button class="undo-btn" onclick="setStatus('+r.id+',\'pending\')">↩ إرجاع</button>';
    }else{
      acts.innerHTML='<button class="undo-btn" onclick="setStatus('+r.id+',\'pending\')">↩ إرجاع للمراجعة</button>';
    }
    list.appendChild(el);
  });
}
async function approveAndNotify(id,phone,street){
  const {error} = await sb.from('join_requests').update({status:'approved'}).eq('id',id);
  if(error){ alert('خطأ: '+error.message); return; }
  // open WhatsApp to congratulate the resident
  const msg='✅ أهلاً بك في حي العمارات! تمت الموافقة على طلبك وأنت الآن ضمن سكان '+stName(street)+' في البوابة الرسمية.';
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  loadRequests(curTab);
}
async function setStatus(id,status){
  const {error} = await sb.from('join_requests').update({status}).eq('id',id);
  if(error){ alert('خطأ: '+error.message); return; }
  loadRequests(curTab);
}

// ---------------- Street status editor ----------------
async function loadStreets(){
  const grid=document.getElementById('stGrid');
  grid.innerHTML='';
  const {data,error} = await sb.from('street_status').select('*').order('street');
  if(error){ grid.innerHTML='<div class="empty">خطأ: '+error.message+'</div>'; return; }
  const map={}; (data||[]).forEach(r=>map[r.street]=r);
  for(let n=1;n<=61;n+=2){
    const r=map[n]||{street:n,p:0,w:0,c:0};
    const card=document.createElement('div');
    card.className='st-card';
    let rows='';
    UTIL.forEach(([k,ic])=>{
      rows+='<div class="st-row"><span>'+ic+'</span><select class="s'+r[k]+'" data-st="'+n+'" data-k="'+k+'">'+
        STATES.map((s,i)=>'<option value="'+i+'"'+(i===r[k]?' selected':'')+'>'+s+'</option>').join('')+
        '</select></div>';
    });
    card.innerHTML='<h3>'+stName(n)+'<span class="saved" id="sv'+n+'">✓ حُفظ</span></h3>'+rows;
    grid.appendChild(card);
  }
  grid.querySelectorAll('select').forEach(sel=>sel.addEventListener('change',async e=>{
    const st=Number(e.target.getAttribute('data-st'));
    const k=e.target.getAttribute('data-k');
    const v=Number(e.target.value);
    e.target.className='s'+v;
    const upd={street:st,updated_at:new Date().toISOString()}; upd[k]=v;
    const {error}=await sb.from('street_status').upsert(upd,{onConflict:'street'});
    if(error){ alert('خطأ في الحفظ: '+error.message); return; }
    const sv=document.getElementById('sv'+st);
    sv.classList.add('show'); setTimeout(()=>sv.classList.remove('show'),1500);
  }));
}

// ---------------- Reps editor ----------------
async function loadReps(){
  const grid=document.getElementById('repGrid');
  grid.innerHTML='';
  const {data} = await sb.from('street_reps').select('*');
  const map={}; (data||[]).forEach(r=>map[r.street]=r);
  for(let n=1;n<=61;n+=2){
    const r=map[n]||{rep_name:'',rep_phone:''};
    const card=document.createElement('div');
    card.className='st-card';
    card.innerHTML='<h3>'+stName(n)+'<span class="saved" id="rsv'+n+'">✓ حُفظ</span></h3>'+
      '<div class="field" style="margin-bottom:.5rem"><input id="rn'+n+'" placeholder="اسم الممثل" value="'+(r.rep_name||'')+'"></div>'+
      '<div class="field" style="margin-bottom:.5rem"><input id="rp'+n+'" dir="ltr" placeholder="447958289559" value="'+(r.rep_phone||'')+'"></div>'+
      '<button class="btn" style="padding:.45rem;font-size:.85rem" onclick="saveRep('+n+')">حفظ</button>';
    grid.appendChild(card);
  }
}
async function saveRep(n){
  const name=document.getElementById('rn'+n).value.trim();
  const phone=document.getElementById('rp'+n).value.trim().replace(/[^\d]/g,'');
  if(!name||!phone){ if(!confirm('حذف ممثل '+stName(n)+'؟')) return; await sb.from('street_reps').delete().eq('street',n); }
  else { await sb.from('street_reps').upsert({street:n,rep_name:name,rep_phone:phone},{onConflict:'street'}); }
  const sv=document.getElementById('rsv'+n);
  sv.classList.add('show'); setTimeout(()=>sv.classList.remove('show'),1500);
}

checkSession();
</script>
</body>
</html>
